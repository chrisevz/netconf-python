---
repositories:
  - name: netconf-python
    description: Cisco IOS XE NETCONF Python driver — single use case (preview + push via config_xml)
    url: https://github.com/chrisevz/netconf-python.git
    # This repo is for testing — the production driver will live on a
    # separate repo, which is where pinning the reference actually matters
    # (IAG5 pulls the repo fresh on every service execution, so an
    # unpinned "main" there would mean every merge is an unreviewed prod
    # deploy). Tracking main here is intentional for fast iteration.
    reference: main

decorators:
  - name: netconf-common-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf common inputs
      type: object
      properties:
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: true

  - name: netconf-get-config-clis-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-get-config-clis inputs
      type: object
      properties:
        datastore:
          description: Datastore to render as CLI text via get-modelled-config-clis (running or candidate). Empty = running.
          type: string
          enum: ["", running, candidate]
        timeout:
          description: >-
            Seconds to wait for the NETCONF connection/RPC reply. A full running-config
            render was measured at ~17s on a CSR1000v lab device — not the same platform
            family as this fleet (Catalyst access/core). Realistic render time on a CAT
            9500 core config is unverified; default is generous to leave margin.
          type: integer
          default: 90
      additionalProperties: false

  - name: netconf-get-config-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-get-config inputs
      type: object
      properties:
        source:
          description: Datastore to read from (running or candidate). Empty = running.
          type: string
          enum: ["", running, candidate]
        filter:
          description: Optional XML subtree filter.
          type: string
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: false

  - name: netconf-preview-config-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-preview-config inputs
      type: object
      properties:
        config_xml:
          description: Raw pre-built NETCONF <config> XML payload to preview, pushed as-is into candidate then discarded.
          type: string
        force_discard:
          description: Default false. If the candidate datastore is already dirty (differs from running — another session's uncommitted work), discard it and proceed instead of returning error_type=DirtyCandidate. Empty = false.
          type: string
          enum: ["", "true", "false"]
          default: "false"
        diff:
          description: Default true. Include a unified diff (running vs candidate) in the result. Empty = true.
          type: string
          enum: ["", "true", "false"]
          default: "true"
        lock_timeout:
          description: Seconds to wait for candidate datastore lock (0 = fail immediately)
          type: integer
          default: 30
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      required: [config_xml]
      additionalProperties: false

  - name: netconf-send-config-xml-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-send-config-xml inputs
      type: object
      properties:
        config_xml:
          description: A complete, pre-built NETCONF <config> XML payload, valid for the target device's YANG model. Pushed as-is via edit-config, then committed.
          type: string
        expect_running_hash:
          description: >-
            Optional drift guard. Pass the running_hash returned by a prior
            netconf-preview-config call — if running config has changed since
            that hash was captured, the push is refused with
            error_type=ConfigDrift instead of applying an approved diff to
            config that has since moved.
          type: string
        lock_timeout:
          description: Seconds to wait for candidate datastore lock (0 = fail immediately)
          type: integer
          default: 30
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      required: [config_xml]
      additionalProperties: false

  - name: netconf-discard-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-discard inputs
      type: object
      properties:
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: false

services:
  - name: netconf-is-alive
    type: python-script
    description: Cisco IOS XE NETCONF — verify reachability via NETCONF session
    repository: netconf-python
    filename: main.py
    decorator: netconf-common-input
    runtime:
      env:
        NETCONF_OP: netconf-is-alive
    tags: [driver, iosxe, netconf, cisco]

  - name: netconf-get-config-clis
    type: python-script
    description: Cisco IOS XE NETCONF — render running or candidate as CLI text via get-modelled-config-clis. This is the device-rendered mechanism behind netconf-preview-config's preview_mode="device-rendered" outcome.
    repository: netconf-python
    filename: main.py
    decorator: netconf-get-config-clis-input
    runtime:
      env:
        NETCONF_OP: netconf-get-config-clis
    tags: [driver, iosxe, netconf, cisco, preview]

  - name: netconf-preview-config
    type: python-script
    description: >-
      Cisco IOS XE NETCONF — stage a proposed config_xml change into candidate,
      diff it against running, then discard. Leaves zero state on the device;
      never commits. The result always includes preview_mode, telling the
      caller which rendering produced the diff: "device-rendered" (the
      device's own CLI render via get-modelled-config-clis, expected on
      17.15.5-class images) or "xml-diff" (a structural get-config XML diff,
      the fallback used when get-modelled-config-clis is unsupported —
      expected on 17.12.4). preview_mode is never absent or guessed; an
      operator approving a change needs to know which one they're looking at.
    repository: netconf-python
    filename: main.py
    decorator: netconf-preview-config-input
    runtime:
      env:
        NETCONF_OP: netconf-preview-config
    tags: [driver, iosxe, netconf, cisco, preview]

  - name: netconf-get-config
    type: python-script
    description: Cisco IOS XE NETCONF — retrieve running or candidate configuration as XML
    repository: netconf-python
    filename: main.py
    decorator: netconf-get-config-input
    runtime:
      env:
        NETCONF_OP: netconf-get-config
    tags: [driver, iosxe, netconf, cisco]

  - name: netconf-send-config-xml
    type: python-script
    description: >-
      Cisco IOS XE NETCONF — push a pre-built NETCONF <config> XML payload
      as-is via candidate/commit. This is the only config-push path in this
      driver. Pair with netconf-preview-config: preview first to get an
      approved diff and a running_hash, then push here with
      expect_running_hash set to that value so a push is refused if running
      config drifted in between.
    repository: netconf-python
    filename: main.py
    decorator: netconf-send-config-xml-input
    runtime:
      env:
        NETCONF_OP: netconf-send-command
    tags: [driver, iosxe, netconf, cisco]

  - name: netconf-discard
    type: python-script
    description: Cisco IOS XE NETCONF — discard whatever is staged in the candidate datastore (e.g. to clear a dirty candidate flagged by netconf-preview-config). Takes its own lock; does not assume anything about how the candidate became dirty.
    repository: netconf-python
    filename: main.py
    decorator: netconf-discard-input
    runtime:
      env:
        NETCONF_OP: netconf-discard
    tags: [driver, iosxe, netconf, cisco]

  - name: netconf-save-config
    type: python-script
    description: >-
      Cisco IOS XE NETCONF — copy running-config to startup-config (write
      memory) so a committed change survives a reload. Tries cisco-ia
      save-config, then Cisco-IOS-XE-rpc copy; reports which method worked.
      Saves the whole running config, not just the last change.
    repository: netconf-python
    filename: main.py
    decorator: netconf-common-input
    runtime:
      env:
        NETCONF_OP: netconf-save-config
    tags: [driver, iosxe, netconf, cisco]
