---
repositories:
  - name: netconf-python
    description: NETCONF Python driver for Cisco IOS XE and NX-OS — preview, push (confirmed commit), save and check via config_xml
    # Set url to the repository the gateway should pull. For production pin
    # reference to a release tag: the gateway pulls the repository on every
    # service execution, so a branch reference deploys every merge at once.
    url: https://github.com/chrisevz/netconf-python.git
    reference: main

decorators:
  - name: netconf-common-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf common inputs
      type: object
      properties:
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: true

  - name: netconf-get-config-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-get-config inputs
      type: object
      properties:
        source:
          description: Datastore to read from (running or candidate). Empty = running.
          type: string
          enum: ["", running, candidate]
        filter:
          description: Optional XML subtree filter.
          type: string
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: false

  - name: netconf-preview-config-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-preview-config inputs
      type: object
      properties:
        config_xml:
          description: Raw pre-built NETCONF <config> XML payload to preview, pushed as-is into candidate then discarded.
          type: string
        force_discard:
          description: Default false. If the candidate datastore is already dirty (differs from running — another session's uncommitted work), discard it and proceed instead of returning error_type=DirtyCandidate. Empty = false.
          type: string
          enum: ["", "true", "false"]
          default: "false"
        diff:
          description: Default true. Include a unified diff (running vs candidate) in the result. Empty = true.
          type: string
          enum: ["", "true", "false"]
          default: "true"
        lock_timeout:
          description: Seconds to wait for candidate datastore lock (0 = fail immediately)
          type: integer
          default: 30
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      required: [config_xml]
      additionalProperties: false

  - name: netconf-send-config-xml-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-send-config-xml inputs
      type: object
      properties:
        config_xml:
          description: A complete, pre-built NETCONF <config> XML payload, valid for the target device's YANG model. Pushed as-is via edit-config, then committed.
          type: string
        expect_running_hash:
          description: >-
            Optional drift guard. Pass the running_hash returned by a prior
            netconf-preview-config call — if running config has changed since
            that hash was captured, the push is refused with
            error_type=ConfigDrift instead of applying an approved diff to
            config that has since moved.
          type: string
        confirm_timeout:
          description: >-
            Seconds for a persistent confirmed commit. If set, the change goes
            live but the DEVICE rolls it back by itself when this many seconds
            pass unless netconf-confirm-commit is called with the returned
            persist_id first — so a dead workflow or gateway still ends in a
            rollback. The result carries persist_id and confirm_deadline_utc.
            The device must advertise :confirmed-commit:1.1, otherwise nothing is
            pushed (no fallback to a plain commit). Empty/unset = plain commit.
          type: integer
          minimum: 1
        lock_timeout:
          description: Seconds to wait for candidate datastore lock (0 = fail immediately)
          type: integer
          default: 30
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      required: [config_xml]
      additionalProperties: false

  - name: netconf-confirm-commit-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-confirm-commit inputs
      type: object
      properties:
        persist_id:
          description: The persist_id returned by the netconf-send-config-xml call that started the confirmed commit.
          type: string
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      required: [persist_id]
      additionalProperties: false

  - name: netconf-cancel-commit-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-cancel-commit inputs
      type: object
      properties:
        persist_id:
          description: The persist_id returned by the netconf-send-config-xml call that started the confirmed commit.
          type: string
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      required: [persist_id]
      additionalProperties: false

  - name: netconf-save-config-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-save-config inputs
      type: object
      properties:
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: true

  - name: netconf-existing-config-check-input
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: netconf-existing-config-check inputs
      type: object
      properties:
        timeout:
          description: Seconds to wait for the NETCONF connection/RPC reply. Defaults to 90.
          type: integer
          default: 90
      additionalProperties: false

services:
  - name: netconf-is-alive
    type: python-script
    description: >-
      NETCONF reachability check and device facts. Platforms: IOS XE and NX-OS.
      Opens a NETCONF session and returns alive, software version, detected
      platform (iosxe, nxos or unknown) and the device's advertised capabilities.
    repository: netconf-python
    filename: main.py
    decorator: netconf-common-input
    runtime:
      env:
        NETCONF_OP: netconf-is-alive
    tags: [driver, iosxe, nxos, netconf, cisco]

  - name: netconf-preview-config
    type: python-script
    description: >-
      Stage a proposed config_xml change into candidate, diff it against running,
      then discard. Platforms: IOS XE and NX-OS. Leaves zero state on the device;
      never commits. The result always includes preview_mode, telling the caller
      which rendering produced the diff: "device-rendered" (the device's own CLI
      render via get-modelled-config-clis; IOS XE 17.15.5-class images) or
      "xml-diff" (a structural get-config XML diff; NX-OS, and IOS XE images
      without get-modelled-config-clis). preview_mode is never absent or guessed;
      an operator approving a change needs to know which one they're looking at.
    repository: netconf-python
    filename: main.py
    decorator: netconf-preview-config-input
    runtime:
      env:
        NETCONF_OP: netconf-preview-config
    tags: [driver, iosxe, nxos, netconf, cisco, preview]

  - name: netconf-get-config
    type: python-script
    description: >-
      Retrieve running or candidate configuration as XML (optional subtree
      filter). Platforms: IOS XE and NX-OS.
    repository: netconf-python
    filename: main.py
    decorator: netconf-get-config-input
    runtime:
      env:
        NETCONF_OP: netconf-get-config
    tags: [driver, iosxe, nxos, netconf, cisco]

  - name: netconf-send-config-xml
    type: python-script
    description: >-
      Push a pre-built NETCONF <config> XML payload as-is via candidate/commit.
      Platforms: IOS XE and NX-OS. This is the only config-push path in this
      driver. Pair with netconf-preview-config: preview first to get an approved
      diff and a running_hash, then push here with expect_running_hash set to that
      value so a push is refused if running config drifted in between. With
      confirm_timeout the commit is a persistent confirmed commit (the device
      rolls it back by itself unless netconf-confirm-commit is called).
    repository: netconf-python
    filename: main.py
    decorator: netconf-send-config-xml-input
    runtime:
      env:
        NETCONF_OP: netconf-send-config-xml
    tags: [driver, iosxe, nxos, netconf, cisco]

  - name: netconf-save-config
    type: python-script
    description: >-
      Copy running-config to startup-config (write memory) so a committed change
      survives a reload. Platforms: IOS XE (tries cisco-ia save-config, then
      Cisco-IOS-XE-rpc copy) and NX-OS (copy_running_config_src). Reports which
      method worked. Saves the whole running config, not just the last change.
    repository: netconf-python
    filename: main.py
    decorator: netconf-save-config-input
    runtime:
      env:
        NETCONF_OP: netconf-save-config
    tags: [driver, iosxe, nxos, netconf, cisco]

  - name: netconf-existing-config-check
    type: python-script
    description: >-
      Read-only check whether a device already carries configuration: a port with
      an access VLAN other than 1, a switchport mode, a trunk allowed list or a
      channel-group, any Port-channel, AAA, or a TACACS server. Platform: IOS XE
      only; NX-OS returns error_type=NotSupported. One get-config of running with
      a narrow filter; no lock, no candidate. Returns only found, findings (short
      lines, capped) and findings_total, never the raw config or any key.
    repository: netconf-python
    filename: main.py
    decorator: netconf-existing-config-check-input
    runtime:
      env:
        NETCONF_OP: netconf-existing-config-check
    tags: [driver, iosxe, netconf, cisco]

  - name: netconf-confirm-commit
    type: python-script
    description: >-
      Confirm a pending persistent confirmed commit started by
      netconf-send-config-xml with confirm_timeout, using its persist_id.
      Platforms: IOS XE and NX-OS. Makes the change permanent in running; it does
      not save to startup (run netconf-save-config after). Fails if the device's
      timer already ran out and it rolled the change back on its own.
    repository: netconf-python
    filename: main.py
    decorator: netconf-confirm-commit-input
    runtime:
      env:
        NETCONF_OP: netconf-confirm-commit
    tags: [driver, iosxe, nxos, netconf, cisco]

  - name: netconf-cancel-commit
    type: python-script
    description: >-
      Cancel a pending persistent confirmed commit now (using its persist_id),
      rolling the device back immediately instead of waiting for its timer.
      Platforms: IOS XE and NX-OS.
    repository: netconf-python
    filename: main.py
    decorator: netconf-cancel-commit-input
    runtime:
      env:
        NETCONF_OP: netconf-cancel-commit
    tags: [driver, iosxe, nxos, netconf, cisco]
